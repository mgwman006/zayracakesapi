name: Deploy to Zayra EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: 'target/zayracakes-0.0.1-SNAPSHOT.jar'
          target: '/home/ubuntu/zayracakes/'

      - name: Restart Spring Boot app on EC2
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
          echo 'Stopping existing process...'
          pkill -TERM -f zayracakes || true
          sleep 5
          echo 'Starting new process...'
          cd /home/ubuntu/zayracakes/target || exit 1
          nohup java -jar zayracakes-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo 'Process started'
          EOF
          rm private_key
